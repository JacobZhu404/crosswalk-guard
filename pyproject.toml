[project]
name = "redlight-crosswalk-violation"
version = "2.3.0"
description = "红灯停车压斑马线自动检测系统 (分层架构 v2.0)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
models = ["ultralytics", "torch", "hyperlpr3"]
# 训练/导出 M1 行人信号分类器 ONNX 用(运行时只需 opencv 的 cv2.dnn, 不需 torch/onnx)
train = ["torch", "onnx"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
