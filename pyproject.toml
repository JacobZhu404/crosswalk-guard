[project]
name = "redlight-crosswalk-violation"
version = "2.3.0"
description = "红灯停车压斑马线自动检测系统 (分层架构 v2.0)"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
models = ["ultralytics", "torch", "hyperlpr3"]
# 训练/导出 M1 行人信号分类器 ONNX 用(运行时只需 opencv 的 cv2.dnn, 不需 torch/onnx)
train = ["torch", "onnx"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# importlib 模式: tests/ 与 tests/unit/ 存在同名文件(test_signal_state_classifier.py),
# 无 __init__.py 时默认 prepend 模式会因 basename 撞车中断收集(整个 suite 挂)。
# importlib 按完整路径导入, 消除撞车且不需给 tests/ 加包标记。
addopts = "-q --import-mode=importlib"
