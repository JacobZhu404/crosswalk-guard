# ============================================================
# 斑马线行人绿灯压线检测 - 全局配置
# 全部参数集中在此, 改这里即可调参, 无需动代码
# ============================================================

video:
  input: "data/input/sample.mp4"      # 输入视频路径
  output_dir: "data/output"           # 输出目录

inference:
  device: "cpu"                       # 固定 cpu (无 GPU)
  fps: 8                              # 车辆检测采样帧率; CPU 友好, 8fps 足够抓静止车
  imgsz: 640                          # 推理尺寸; CPU 可降到 416/320 提速
  conf_thres: 0.35                    # 检测置信度阈值
  iou_thres: 0.5                      # NMS IoU 阈值
  crosswalk_interval: 4               # 每 N 个(采样)帧重检一次斑马线
  light_interval: 8                   # 每 N 个(采样)帧重检一次红绿灯
  plate_interval: 3                   # 每 N 个(采样)帧重检一次车牌
  plate_conf: 0.4                     # 车牌识别置信度阈值

# 实际运行栈 (2026-07-11 更正, 修复 E11 配置漂移):
#   车辆检测 = ultralytics YOLOv8n (torch CPU)
#   车牌识别 = HyperLPR3 HIGH
#   斑马线/红绿灯 = 纯 CV 兜底 (HSV + 形态学)
# 下方 onnx 路径为"可选增强": 若放置对应权重则自动启用, 缺失不影响运行。
models:
  vehicle: "models/yolov8n.pt"        # YOLOv8n (torch CPU)
  crosswalk_seg: "models/crosswalk_seg.onnx"   # 斑马线分割(可选, 缺省走 CV 兜底)
  traffic_light: "models/traffic_light.onnx"   # 红绿灯模型(可选, 缺省走 color v2 强化版)
  plate_ocr: "models/plate_crnn.onnx"          # 车牌 OCR(可选, 缺省走 HyperLPR3)

# 参与违规判定的车种 (按 COCO 类别名)
vehicle_classes: ["car", "bus", "truck"]

crosswalk:
  method: "auto"        # auto(优先模型,无则CV) | segment | cv
  overlap_ratio: 0.30   # 车辆面积落入斑马线比例 >= 此值 判为"压线" (可视化/参考用)
  cv_min_area: 3000     # CV 兜底时最小条纹面积阈值

# 红绿灯检测器 v2 (strengthened, 见设计文档 §5.3.3)
# 识别对象假设 = 斑马线行人信号灯 (Q5)
traffic_light:
  method: "color"             # v2 颜色兜底(强化版); 可选升级为 model(YOLO 交通灯)
  smoothing_window: 8         # 时序聚合窗口(帧)
  color_min_pixels: 60        # 颜色兜底时最小亮斑像素数
  min_area_ratio: 0.0006      # 候选灯最小面积占 ROI 比例
  max_aspect_ratio: 3.0       # 长宽比上限, 拒绝细长尾灯
  search_band: [0.0, 0.65]    # 仅在上中部搜索(信号灯挂高处)
  flicker_toggle_count: 2     # 窗口内可见性跳变 >= 此值 -> flashing
  persistence_min_ratio: 0.5  # 候选出现帧占比低于此 -> 时隐时现, 判 unknown

# 静止判定由 Tracker V2 的 SENSITIVITY_PRESETS 控制 (src/redlight/pipeline/tracker.py)
# 不再由本配置单独驱动逻辑, 此处仅作说明
stationary:
  note: "速度/持续阈值见 tracker.SENSITIVITY_PRESETS (balanced: speed=30, sustain=5)"

# 违规语义 (2026-07-11 反转, 见 §5.3.1):
#   违规 = 行人绿灯/闪烁 + 车辆静止 + 压线(overlap >= preset.overlap)
#   🔴红灯 = 车辆可通行(不违规); ❓unknown + 遮挡 = review
violation:
  note: "违规 = 行人绿灯/闪烁 + 静止 + 压线(overlap>=preset)"
  min_event_gap_sec: 5          # 同一 track 两次事件最小间隔, 去重用

output:
  annotated_video: true     # 输出带标注视频
  csv_report: true          # 输出违规事件 CSV
  evidence_images: true     # 输出证据截图
  unknown_light_to_review: true  # 斑马线被遮挡且信号未知时归入"待复核"
  signal_assumption: "pedestrian"   # 假设信号=斑马线行人灯; 报告标注便于复核
